name: Xray VMESS Tunnel with Docker

on:
  workflow_dispatch:

jobs:
  xray-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq uuid-runtime qrencode curl
        
    - name: Generate configs
      id: config
      run: |
        UUID=$(uuidgen | tr '[:upper:]' '[:lower:]')
        PATH_RANDOM=$(cat /dev/urandom | tr -dc 'a-z0-9' | fold -w 12 | head -n 1)
        PORT=10000
        
        echo "uuid=$UUID" >> $GITHUB_OUTPUT
        echo "path=/$PATH_RANDOM" >> $GITHUB_OUTPUT
        echo "port=$PORT" >> $GITHUB_OUTPUT
        
        # ساخت کانفیگ Xray
        cat > config.json << EOF
        {
          "inbounds": [
            {
              "port": $PORT,
              "protocol": "vmess",
              "settings": {
                "clients": [
                  {
                    "id": "$UUID",
                    "alterId": 0
                  }
                ]
              },
              "streamSettings": {
                "network": "ws",
                "wsSettings": {
                  "path": "/$PATH_RANDOM"
                }
              }
            }
          ],
          "outbounds": [
            {
              "protocol": "freedom"
            }
          ]
        }
        EOF
        
    - name: Run Xray with Docker
      run: |
        docker run -d \
          --name xray \
          -p ${{ steps.config.outputs.port }}:${{ steps.config.outputs.port }} \
          -v $(pwd)/config.json:/etc/xray/config.json \
          teddysun/xray:latest
        
        sleep 3
        docker ps
        
    - name: Install cloudflared
      run: |
        curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
        chmod +x cloudflared
        sudo mv cloudflared /usr/local/bin/
        
    - name: Create tunnel
      run: |
        cloudflared tunnel --url http://localhost:${{ steps.config.outputs.port }} --no-autoupdate > tunnel.log 2>&1 &
        sleep 10
        
        TUNNEL_URL=$(grep -o 'https://[a-z0-9.-]*\.trycloudflare.com' tunnel.log | head -1)
        DOMAIN=$(echo $TUNNEL_URL | sed 's|https://||')
        
        echo "Tunnel URL: $TUNNEL_URL"
        
        # ساخت لینک VMESS
        VMESS_JSON=$(jq -n \
          --arg v "2" \
          --arg ps "Docker-Xray-Tunnel" \
          --arg add "$DOMAIN" \
          --arg port "443" \
          --arg id "${{ steps.config.outputs.uuid }}" \
          --arg aid "0" \
          --arg net "ws" \
          --arg path "${{ steps.config.outputs.path }}" \
          --arg tls "tls" \
          '{v: $v, ps: $ps, add: $add, port: $port, id: $id, aid: $aid, net: $net, path: $path, tls: $tls}')
        
        VMESS_LINK="vmess://$(echo -n $VMESS_JSON | base64 -w 0)"
        
        echo "=========================================="
        echo "VMESS Link:"
        echo "$VMESS_LINK"
        echo "=========================================="
        
        echo "$VMESS_LINK" > vmess_link.txt
        echo "$TUNNEL_URL" > tunnel_url.txt
        
        # نمایش QR Code
        qrencode -t ansiutf8 "$VMESS_LINK"
        
        # نگهداری تونل
        sleep 21600
        
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: configs
        path: |
          vmess_link.txt
          tunnel_url.txt
          config.json
        retention-days: 1
