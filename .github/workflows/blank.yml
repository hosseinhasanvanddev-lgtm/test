name: Xray VMESS Tunnel - Fixed

on:
  workflow_dispatch:

jobs:
  xray-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y curl wget unzip jq uuid-runtime qrencode socat
        
    - name: Install Xray (Alternative method)
      run: |
        # روش جایگزین برای نصب Xray
        curl -L https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o Xray.zip
        unzip Xray.zip -d xray_temp
        sudo mkdir -p /usr/local/share/xray /usr/local/etc/xray
        sudo cp xray_temp/xray /usr/local/bin/
        sudo cp xray_temp/geoip.dat /usr/local/share/xray/
        sudo cp xray_temp/geosite.dat /usr/local/share/xray/
        sudo chmod +x /usr/local/bin/xray
        rm -rf Xray.zip xray_temp
        
        # بررسی نصب
        /usr/local/bin/xray -version
        
    - name: Generate configs
      id: random
      run: |
        echo "Starting config generation..."
        
        # تولید مقادیر تصادفی
        UUID=$(cat /proc/sys/kernel/random/uuid)
        PATH_RANDOM=$(tr -dc 'a-zA-Z0-9' < /dev/urandom | fold -w 12 | head -n 1)
        PORT=$((RANDOM % 50000 + 10000))
        
        echo "uuid=$UUID" >> $GITHUB_OUTPUT
        echo "path=/$PATH_RANDOM" >> $GITHUB_OUTPUT
        echo "port=$PORT" >> $GITHUB_OUTPUT
        
        echo "✅ Config generated: UUID=$UUID, Port=$PORT, Path=/$PATH_RANDOM"
        
    - name: Create Xray config
      run: |
        # ایجاد پوشه کانفیگ
        sudo mkdir -p /usr/local/etc/xray
        
        # نوشتن کانفیگ
        sudo tee /usr/local/etc/xray/config.json > /dev/null << EOF
        {
          "log": {
            "loglevel": "warning",
            "access": "/dev/null",
            "error": "/dev/null"
          },
          "inbounds": [
            {
              "listen": "127.0.0.1",
              "port": ${{ steps.random.outputs.port }},
              "protocol": "vmess",
              "settings": {
                "clients": [
                  {
                    "id": "${{ steps.random.outputs.uuid }}",
                    "alterId": 0
                  }
                ]
              },
              "streamSettings": {
                "network": "ws",
                "wsSettings": {
                  "path": "${{ steps.random.outputs.path }}"
                }
              }
            }
          ],
          "outbounds": [
            {
              "protocol": "freedom"
            }
          ]
        }
        EOF
        
        echo "✅ Xray config created successfully"
        cat /usr/local/etc/xray/config.json | jq .
        
    - name: Run Xray
      run: |
        # اجرای Xray به صورت مستقیم
        sudo /usr/local/bin/xray -c /usr/local/etc/xray/config.json &
        XRAY_PID=$!
        echo "xray_pid=$XRAY_PID" >> $GITHUB_OUTPUT
        sleep 3
        
        # بررسی اجرای Xray
        if ps -p $XRAY_PID > /dev/null; then
          echo "✅ Xray is running (PID: $XRAY_PID)"
        else
          echo "❌ Xray failed to start"
          exit 1
        fi
