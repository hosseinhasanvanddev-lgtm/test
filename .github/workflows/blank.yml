name: Create Xray VMESS Tunnel

on:
  workflow_dispatch:

jobs:
  xray-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y curl wget unzip jq uuid-runtime qrencode
        
    - name: Install Xray with sudo
      run: |
        # نصب Xray با دسترسی sudo
        sudo bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install
        
    - name: Generate random configurations
      id: random
      run: |
        # این مرحله کمتر از 0.1 ثانیه طول می‌کشد
        UUID=$(uuidgen 2>/dev/null || cat /proc/sys/kernel/random/uuid 2>/dev/null || echo "12345678-1234-1234-1234-123456789012")
        PORT="10000"
        PATH_WS="ws"
        
        echo "uuid=$UUID" >> $GITHUB_OUTPUT
        echo "port=$PORT" >> $GITHUB_OUTPUT
        echo "path=/$PATH_WS" >> $GITHUB_OUTPUT
        
        echo "✅ Config generated in < 0.1s"
        
    - name: Create Xray config
      run: |
        # ساخت کانفیگ با sudo
        sudo bash -c "cat > /usr/local/etc/xray/config.json << EOF
        {
          \"log\": {
            \"loglevel\": \"warning\"
          },
          \"inbounds\": [
            {
              \"listen\": \"127.0.0.1\",
              \"port\": ${{ steps.random.outputs.port }},
              \"protocol\": \"vmess\",
              \"settings\": {
                \"clients\": [
                  {
                    \"id\": \"${{ steps.random.outputs.uuid }}\",
                    \"alterId\": 0,
                    \"security\": \"auto\"
                  }
                ]
              },
              \"streamSettings\": {
                \"network\": \"ws\",
                \"wsSettings\": {
                  \"path\": \"${{ steps.random.outputs.path }}\"
                }
              }
            }
          ],
          \"outbounds\": [
            {
              \"protocol\": \"freedom\",
              \"tag\": \"direct\"
            }
          ]
        }
        EOF"
        
    - name: Start Xray service
      run: |
        sudo systemctl start xray
        sudo systemctl enable xray
        sleep 3
        sudo systemctl status xray --no-pager
        
    - name: Install cloudflared
      run: |
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        chmod +x cloudflared-linux-amd64
        sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared
        
    - name: Create tunnel
      id: tunnel
      run: |
        # اجرای تونل در پس‌زمینه
        nohup cloudflared tunnel --url http://127.0.0.1:${{ steps.random.outputs.port }} --no-autoupdate > tunnel.log 2>&1 &
        
        # انتظار برای ایجاد تونل
        sleep 10
        
        # استخراج آدرس تونل
        TUNNEL_URL=$(grep -o 'https://[a-z0-9.-]*\.trycloudflare.com' tunnel.log | head -1)
        
        if [ -z "$TUNNEL_URL" ]; then
          echo "Waiting longer for tunnel..."
          sleep 10
          TUNNEL_URL=$(grep -o 'https://[a-z0-9.-]*\.trycloudflare.com' tunnel.log | head -1)
        fi
        
        echo "tunnel_url=$TUNNEL_URL" >> $GITHUB_OUTPUT
        echo "Tunnel URL: $TUNNEL_URL"
        
        echo "$TUNNEL_URL" > tunnel_url.txt
        echo "${{ steps.random.outputs.uuid }}" > uuid.txt
        
    - name: Generate VMESS link
      run: |
        TUNNEL_URL=$(cat tunnel_url.txt)
        DOMAIN=$(echo $TUNNEL_URL | sed 's|https://||')
        UUID=$(cat uuid.txt)
        PATH_VMESS="${{ steps.random.outputs.path }}"
        
        # ساخت VMESS لینک
        VMESS_CONFIG=$(jq -n \
          --arg v "2" \
          --arg ps "GHActions-Xray" \
          --arg add "$DOMAIN" \
          --arg port "443" \
          --arg id "$UUID" \
          --arg aid "0" \
          --arg net "ws" \
          --arg type "none" \
          --arg host "$DOMAIN" \
          --arg path "$PATH_VMESS" \
          --arg tls "tls" \
          '{v: $v, ps: $ps, add: $add, port: $port, id: $id, aid: $aid, net: $net, type: $type, host: $host, path: $path, tls: $tls}')
        
        VMESS_LINK="vmess://$(echo -n $VMESS_CONFIG | base64 -w 0)"
        
        echo "=========================================="
        echo "✅ Xray VMESS Tunnel Ready"
        echo "=========================================="
        echo ""
        echo "📡 VMESS Link:"
        echo "$VMESS_LINK"
        echo ""
        echo "📋 Details:"
        echo "   Address: $DOMAIN"
        echo "   Port: 443"
        echo "   UUID: $UUID"
        echo "   Path: $PATH_VMESS"
        echo "   Security: tls"
        echo "   Network: ws"
        echo ""
        
        echo "$VMESS_LINK" > vmess_link.txt
        
        # نمایش QR Code
        qrencode -t ansiutf8 "$VMESS_LINK"
        
        # ساخت کانفیگ JSON
        cat > client-config.json << EOF
        {
          "outbounds": [
            {
              "protocol": "vmess",
              "settings": {
                "vnext": [
                  {
                    "address": "$DOMAIN",
                    "port": 443,
                    "users": [
                      {
                        "id": "$UUID",
                        "alterId": 0,
                        "security": "auto"
                      }
                    ]
                  }
                ]
              },
              "streamSettings": {
                "network": "ws",
                "security": "tls",
                "wsSettings": {
                  "path": "$PATH_VMESS"
                }
              }
            }
          ]
        }
        EOF
        
    - name: Keep tunnel alive
      run: |
        echo "=========================================="
        echo "🟢 Tunnel is running for 6 hours"
        echo "=========================================="
        echo "VMESS Link: $(cat vmess_link.txt)"
        echo ""
        echo "Download config from Artifacts section"
        echo "=========================================="
        
        # نگهداری تونل به مدت 6 ساعت
        sleep 21600
        
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: xray-configs
        path: |
          client-config.json
          vmess_link.txt
          tunnel_url.txt
          uuid.txt
        retention-days: 1
