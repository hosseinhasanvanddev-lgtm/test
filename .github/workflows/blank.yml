name: Simple Xray Tunnel

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
    - name: Setup
      run: |
        # نصب Xray
        curl -L https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o Xray.zip
        unzip -o Xray.zip -d xray
        sudo mv xray/xray /usr/local/bin/
        sudo chmod +x /usr/local/bin/xray
        rm -rf Xray.zip xray
        
    - name: Generate Config
      id: config
      run: |
        # UUID ثابت برای تست (می‌توانید تغییر دهید)
        UUID="8a4b5c6d-7e8f-9a0b-1c2d-3e4f5a6b7c8d"
        echo "uuid=$UUID" >> $GITHUB_OUTPUT
        
        # کانفیگ ساده
        cat > config.json << EOF
        {
          "inbounds": [{
            "port": 10000,
            "protocol": "vmess",
            "settings": {
              "clients": [{"id": "$UUID", "alterId": 0}]
            },
            "streamSettings": {
              "network": "ws",
              "wsSettings": {"path": "/"}
            }
          }],
          "outbounds": [{"protocol": "freedom"}]
        }
        EOF
        
    - name: Run Xray
      run: |
        /usr/local/bin/xray run -c config.json &
        sleep 3
        
        # بررسی
        curl -s http://localhost:10000 && echo "✅ Xray is running" || echo "⚠️ Xray check failed"
        
    - name: Setup GitHub Pages
      run: |
        mkdir -p public
        echo "Xray WebSocket Tunnel Active" > public/index.html
        touch public/.nojekyll
        
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        publish_branch: gh-pages
        
    - name: Show Config
      run: |
        DOMAIN="${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        UUID="${{ steps.config.outputs.uuid }}"
        
        VMESS="vmess://$(echo -n "{\"v\":\"2\",\"ps\":\"Xray\",\"add\":\"$DOMAIN\",\"port\":\"443\",\"id\":\"$UUID\",\"aid\":\"0\",\"net\":\"ws\",\"path\":\"/\",\"tls\":\"tls\"}" | base64 -w 0)"
        
        echo "========================================="
        echo "VMESS Link:"
        echo "$VMESS"
        echo "========================================="
        echo "$VMESS" > link.txt
        
        sleep 21600
        
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: config
        path: link.txt
