name: Create Temporary Tunnel for V2Ray

on:
  workflow_dispatch:  # اجرای دستی

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # حداکثر 6 ساعت اجرا
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y curl wget unzip jq
        
    - name: Install cloudflared
      run: |
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        chmod +x cloudflared-linux-amd64
        sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared
        
    - name: Create V2Ray config
      run: |
        cat > v2ray-config.json << 'EOF'
        {
          "inbounds": [
            {
              "port": 10000,
              "protocol": "vmess",
              "settings": {
                "clients": [
                  {
                    "id": "UUID_PLACEHOLDER",
                    "alterId": 0
                  }
                ]
              },
              "streamSettings": {
                "network": "ws",
                "wsSettings": {
                  "path": "/ray"
                }
              }
            }
          ],
          "outbounds": [
            {
              "protocol": "freedom",
              "settings": {}
            }
          ]
        }
        EOF
        
    - name: Generate UUID
      id: uuid
      run: |
        UUID=$(cat /proc/sys/kernel/random/uuid)
        sed -i "s/UUID_PLACEHOLDER/$UUID/g" v2ray-config.json
        echo "uuid=$UUID" >> $GITHUB_OUTPUT
        
    - name: Setup V2Ray
      run: |
        bash <(curl -L https://raw.githubusercontent.com/v2fly/fhs-install-v2ray/master/install-release.sh)
        sudo cp v2ray-config.json /usr/local/etc/v2ray/config.json
        sudo systemctl start v2ray
        sudo systemctl enable v2ray
        
    - name: Create Cloudflare Tunnel
      id: tunnel
      run: |
        # ایجاد تونل به پورت 10000
        cloudflared tunnel --url http://localhost:10000 --no-autoupdate > tunnel.log 2>&1 &
        sleep 5
        
        # استخراج آدرس تونل
        TUNNEL_URL=$(grep -o 'https://[a-z0-9.-]*\.trycloudflare.com' tunnel.log | head -1)
        echo "tunnel_url=$TUNNEL_URL" >> $GITHUB_OUTPUT
        echo "Tunnel URL: $TUNNEL_URL"
        
        # ذخیره آدرس در فایل
        echo $TUNNEL_URL > tunnel_url.txt
        
    - name: Display V2Ray Configuration
      run: |
        TUNNEL_URL=$(cat tunnel_url.txt)
        UUID=$(echo "${{ steps.uuid.outputs.uuid }}")
        
        echo "=========================================="
        echo "V2Ray Configuration for Client:"
        echo "=========================================="
        echo "Address: ${TUNNEL_URL#https://}"
        echo "Port: 443"
        echo "UUID: $UUID"
        echo "AlterID: 0"
        echo "Security: auto"
        echo "Network: ws"
        echo "Path: /ray"
        echo "=========================================="
        
        # ایجاد فایل کانفیگ V2Ray برای کلاینت
        cat > client-config.json << EOF
        {
          "outbounds": [
            {
              "protocol": "vmess",
              "settings": {
                "vnext": [
                  {
                    "address": "${TUNNEL_URL#https://}",
                    "port": 443,
                    "users": [
                      {
                        "id": "$UUID",
                        "alterId": 0,
                        "security": "auto"
                      }
                    ]
                  }
                ]
              },
              "streamSettings": {
                "network": "ws",
                "security": "tls",
                "wsSettings": {
                  "path": "/ray"
                }
              }
            }
          ]
        }
        EOF
        
        echo "Client config saved to client-config.json"
        
    - name: Keep tunnel alive
      run: |
        # نگه‌داشتن تونل تا پایان زمان
        echo "Tunnel is running. Check GitHub Actions log for configuration."
        echo "Tunnel URL: $(cat tunnel_url.txt)"
        echo "UUID: ${{ steps.uuid.outputs.uuid }}"
        
        # نمایش لاگ تونل هر 60 ثانیه
        while true; do
          sleep 60
          echo "Tunnel still alive... (running for $SECONDS seconds)"
        done
        
    - name: Upload config artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: v2ray-config
        path: |
          client-config.json
          tunnel_url.txt
