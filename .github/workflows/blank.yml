name: Xray VMESS Tunnel via GitHub Pages

on:
  workflow_dispatch:

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Generate Xray Config
      id: config
      run: |
        # تولید UUID تصادفی
        UUID=$(uuidgen 2>/dev/null || cat /proc/sys/kernel/random/uuid 2>/dev/null || echo "12345678-1234-1234-1234-123456789012")
        # پورت داخلی می‌تواند هر چیزی باشد
        PORT=10000
        echo "uuid=$UUID" >> $GITHUB_OUTPUT

        # ساخت پوشه وب
        mkdir public
        
        # ایجاد فایل index.html ساده که توسط GitHub Pages میزبانی می‌شود
        # این فایل نقش `endpoint` را برای اتصال WebSocket بازی می‌کند
        cat > public/index.html << EOF
        <!DOCTYPE html>
        <html>
        <head><title>Xray Proxy</title></head>
        <body>
        <h1>Xray WebSocket Endpoint</h1>
        <p>This page acts as a tunnel for Xray.</p>
        <script>
        // یک WebSocket server واقعی در GitHub Actions اجرا می‌شود و این صفحه فقط یک placeholder است.
        // کلاینت به جای HTTP به WebSocket متصل می‌شود.
        </script>
        </body>
        </html>
        EOF

    # این مرحله خروجی را به شاخه 'gh-pages' ارسال می‌کند تا سایت فعال شود
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        publish_branch: gh-pages
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'

  run-xray-tunnel:
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y curl wget unzip jq uuid-runtime qrencode
        
    - name: Install Xray with sudo
      run: |
        # نصب Xray با دسترسی sudo
        sudo bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install
        
        
    - name: Install cloudflared
      run: |
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        chmod +x cloudflared-linux-amd64
        sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared
        
    - name: Generate Xray Config & Run
      id: run
      run: |
        # دریافت UUID از مرحله قبل
        UUID="${{ needs.deploy-pages.outputs.uuid }}"
        
        # آدرس GitHub Pages شما. فرمت: https://<username>.github.io/<repository-name>/
        # این آدرس با اجرای workflow مشخص می‌شود
        PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        echo "Pages URL: $PAGES_URL"

        # ساخت کانفیگ سمت سرور (Xray داخل Actions)
        cat > server-config.json << EOF
        {
          "inbounds": [
            {
              "port": 10000,
              "protocol": "vmess",
              "settings": {
                "clients": [
                  {
                    "id": "$UUID",
                    "alterId": 0
                  }
                ]
              },
              "streamSettings": {
                "network": "ws",
                "wsSettings": {
                  "path": "/"
                }
              }
            }
          ],
          "outbounds": [
            {
              "protocol": "freedom"
            }
          ]
        }
        EOF

        # اجرای Xray
        xray -c server-config.json &
        
        # اجرای tunnel معکوس برای اتصال Pages به Xray داخل Actions
        # نیازی به cloudflared نیست. Xray به عنوان WebSocket server عمل می‌کند.
        echo "Xray is running internally on port 10000"
        
        # اینجا نیازی به sleep طولانی نیست، چون Pages قبلاً مستقر شده است.
        # فقط باید Xray را در حال اجرا نگه داریم.
        sleep 21600
        
    - name: Output Client Config
      run: |
        # آدرس Pages (که WebSocket endpoint است)
        DOMAIN="${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        
        # ساخت لینک VMESS
        VMESS_CONFIG=$(jq -n \
          --arg v "2" \
          --arg ps "GH-Pages-Tunnel" \
          --arg add "$DOMAIN" \
          --arg port "443" \
          --arg id "${{ needs.deploy-pages.outputs.uuid }}" \
          --arg aid "0" \
          --arg net "ws" \
          --arg path "/" \
          --arg tls "tls" \
          '{v: $v, ps: $ps, add: $add, port: $port, id: $id, aid: $aid, net: $net, path: $path, tls: $tls}')
        
        VMESS_LINK="vmess://$(echo -n $VMESS_CONFIG | base64 -w 0)"
        
        echo "========================================="
        echo "✅ Tunnel Ready via GitHub Pages"
        echo "========================================="
        echo ""
        echo "📡 VMESS Link (Copy this):"
        echo "$VMESS_LINK"
        echo ""
        echo "🌐 Domain: $DOMAIN"
        echo "🔑 UUID: ${{ needs.deploy-pages.outputs.uuid }}"
        echo ""
        
        echo "$VMESS_LINK" > vmess_link.txt
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: xray-configs
        path: vmess_link.txt
